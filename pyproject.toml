[project]
name = "reclamacoes"
version = "0.1.0"
description = "Classificação de reclamações de clientes com LLM (Gemini) comparada a um baseline de ML clássico"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
